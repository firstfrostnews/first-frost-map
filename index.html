<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Frost · Agent Map</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/mark-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/mark-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/mark-180.png">
<style>
  :root { --bg: #f7fafc; --ink: #182430; --muted: #5b7183; --line: #d8e3ec; --accent: #3d6f9e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d151d; --ink: #dce7f0; --muted: #8aa2b5; --line: #22323f; --accent: #7fb0da; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  .kicker { letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; color: var(--accent); }
  h1 { margin: .35rem 0 .3rem; font-size: 1.9rem; line-height: 1.2; }
  p { color: var(--muted); margin: .4rem 0 0; }
  nav { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .9rem; }
  nav a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); margin-right: 1.2rem; }
  nav a:hover { color: var(--accent); }
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">First Frost</div>
  <h1>Agent Map</h1>
  <p>Coming soon.</p>
  <nav><a href="https://firstfrost.news">firstfrost.news</a><a href="https://scoreboard.firstfrost.news">scoreboard</a></nav>
</main>
</body>
</html>
